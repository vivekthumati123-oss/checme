version: 1
mode: report
languages:
  javascript:
    enabled: true
    framework: vitest
    workingDirectory: packages/app
    testCommand: "npx vitest run --coverage"
    coverageFile: coverage/lcov.info
    coverageFormat: lcov
    sourceGlobs:
      - "src/**/*.ts"
    testPathPatterns:
      - "packages/app/test/{name}.test.{ext}"

