version: 1
mode: report
languages:
  java:
    enabled: true
    framework: junit5
    buildTool: auto
    testCommand: "mvn test"
    coverageFile: target/site/jacoco/jacoco.xml
    coverageFormat: jacoco
    sourceGlobs:
      - "src/main/java/**/*.java"
    testPathPatterns:
      - "src/test/java/{package}/{Name}Test.java"

