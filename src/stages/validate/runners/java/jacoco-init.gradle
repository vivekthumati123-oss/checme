allprojects { proj ->
  proj.plugins.withId('java') {
    // Call pluginManager on the Project instance explicitly; bare `apply` in an init script targets Gradle.
    proj.pluginManager.apply('jacoco')
    def jacocoVer = System.getenv('UA_JACOCO_VERSION')
    if (jacocoVer) {
      proj.extensions.configure('jacoco') { ext ->
        ext.toolVersion = jacocoVer
      }
    }
    proj.tasks.withType(org.gradle.testing.jacoco.tasks.JacocoReport).configureEach { reportTask ->
      try {
        reportTask.reports.xml.required.set(true)
      } catch (MissingPropertyException ignored) {
        reportTask.reports.xml.enabled = true
      }
    }
    proj.tasks.matching { it.name == 'test' }.configureEach { testTask ->
      testTask.finalizedBy(proj.tasks.named('jacocoTestReport'))
    }
  }
}

