# TestGen may only write test files. Hooks add a second, content-aware layer.
agent: testgen
rules:
  - action: repository.read
    effect: allow
  - action: pull-request.comment
    effect: allow
  - action: check.publish
    effect: allow
  - action: file.write
    effect: allow
    conditions:
      paths:
        - tests/**
        - test/**
        - src/**/__tests__/**
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.test.jsx"
        - "**/*.test.mjs"
        - "**/*.spec.js"
        - "**/*.spec.jsx"
        - "**/*.spec.ts"
        - "**/*.spec.tsx"
        - "**/test_*.py"
        - "**/*_test.py"
        - "**/*Test.java"
        - "**/*Tests.java"
        - "**/*Tests.cs"
  - action: file.write
    effect: deny
    conditions:
      paths:
        - .git/**
        - .github/**
        - .vscode/**
        - node_modules/**
        - infrastructure/**
        - "**/*.env"
        - "**/.env"
        - "**/.env.*"
        - "**/*.pem"
        - "**/*.key"
    reason: TestGen must never modify pipelines, infrastructure or secrets
  - action: commit.create
    effect: require-approval
  - action: command.execute
    effect: allow
    conditions:
      commands: [npm test, pnpm test, pytest, mvn test, dotnet test]
