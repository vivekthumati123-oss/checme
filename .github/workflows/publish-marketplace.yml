name: Publish marketplace

# On a release tag, regenerate the marketplace from bundles.json and push it to the marketplace repo.
# Requires secret MARKETPLACE_TOKEN (contents:write on the marketplace repo, SSO-authorised).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this workflow from a release tag such as v1.3.0."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run package -- --ref "${GITHUB_REF_NAME}"
      - id: target
        run: echo "repo=$(node -p "require('./bundles.json').marketplace.repository")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repo }}
          token: ${{ secrets.MARKETPLACE_TOKEN }}
          path: marketplace-repo
      - name: Sync and push
        run: |
          rsync -a --delete --exclude .git dist/marketplace/ marketplace-repo/
          cd marketplace-repo
          git config user.name "l2-platform-bot"
          git config user.email "l2-platform-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish ${GITHUB_REF_NAME} from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git tag "${GITHUB_REF_NAME}"
          git push --atomic origin HEAD "refs/tags/${GITHUB_REF_NAME}"
