name: unit-agent
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: unit-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  unit-agent:
    if: >
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[unit-agent]') &&
      (github.event.action != 'labeled' || github.event.label.name == 'unit-agent:run')
    uses: ./.github/workflows/_testgen-run.yml
    permissions:
      contents: write
      pull-requests: write
      actions: read
    with:
      config-path: .unit-agent.yml
      approval-environment: unit-agent-approval
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COMMIT_PAT: ${{ secrets.UNIT_AGENT_COMMIT_PAT }}

