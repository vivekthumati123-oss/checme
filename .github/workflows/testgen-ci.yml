name: TestGen CI

on:
  push:
    branches: [main]
    paths:
      - "agents/node/testgen/**"
      - "tests/unit/agents/node/testgen/**"
      - "docs/testgen/**"
      - ".unit-agent.yml"
      - ".github/workflows/testgen-*.yml"
      - ".github/workflows/_testgen-*.yml"
      - ".github/workflows/unit-agent.yml"
  pull_request:
    paths:
      - "agents/node/testgen/**"
      - "tests/unit/agents/node/testgen/**"
      - "docs/testgen/**"
      - ".unit-agent.yml"
      - ".github/workflows/testgen-*.yml"
      - ".github/workflows/_testgen-*.yml"
      - ".github/workflows/unit-agent.yml"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: >
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[unit-agent]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node agents/node/testgen/scripts/check-secrets.mjs
      - run: npm run --workspace @l2/agent-testgen format:check
      - run: npm run --workspace @l2/agent-testgen typecheck
      - run: npm run --workspace @l2/agent-testgen lint
      - run: npm run --workspace @l2/agent-testgen build
      - run: git diff --exit-code agents/node/testgen/schema/
      - run: node --throw-deprecation agents/node/testgen/dist/cli.js --help
      - run: npm run --workspace @l2/agent-testgen test:unit
      - run: npm run --workspace @l2/agent-testgen test:integration
      - run: npm run --workspace @l2/agent-testgen test:security
      - run: npm run --workspace @l2/agent-testgen test:contract
      - run: npm run validate
      - run: node --test tests/node/agents.test.js
      - run: npm run eval
