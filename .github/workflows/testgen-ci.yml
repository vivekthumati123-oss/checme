name: TestGen CI

on:
  push:
    branches: [main]
    paths:
      - "agents/node/testgen/**"
      - "tests/unit/agents/node/testgen/**"
      - ".unit-agent.yml"
      - ".github/workflows/testgen-*.yml"
      - ".github/workflows/_testgen-*.yml"
      - ".github/workflows/unit-agent.yml"
  pull_request:
    paths:
      - "agents/node/testgen/**"
      - "tests/unit/agents/node/testgen/**"
      - ".unit-agent.yml"
      - ".github/workflows/testgen-*.yml"
      - ".github/workflows/_testgen-*.yml"
      - ".github/workflows/unit-agent.yml"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-secrets.mjs
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:unit-agent
      - run: git diff --exit-code agents/node/testgen/schema/
      - run: node --throw-deprecation agents/node/testgen/dist/cli.js --help
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:security
      - run: npm run test:contract
      - run: npm run validate
      - run: node --test tests/node/agents.test.js
      - run: npm run eval
