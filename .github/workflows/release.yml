name: unit-agent-release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:unit-agent
      - run: npm test
      - run: npm run validate

  package-and-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:unit-agent
      - shell: bash
        env:
          UA_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STAGE="release-bundle"
          mkdir -p "$STAGE"
          cp -r dist/* "$STAGE/"
          echo "$UA_TAG" > "$STAGE/VERSION"
          if [ -f LICENSE ]; then cp LICENSE "$STAGE/"; fi
          zip -r "unit-agent-cli-${UA_TAG}.zip" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: unit-agent-cli-zip
          path: "unit-agent-cli-*.zip"
          retention-days: 30

