name: unit-agent-run
on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: ".unit-agent.yml"
      approval-environment:
        type: string
        default: "unit-agent-approval"
      approval-check:
        type: string
        default: "api"
      agent-node-version:
        type: string
        default: "22"
      agent-repository:
        type: string
        default: ""
      agent-ref:
        type: string
        default: ""
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true
      COMMIT_PAT:
        required: false

permissions: {}

env:
  UA_CONFIG: ${{ inputs.config-path }}
  UNIT_AGENT_ENABLED: ${{ vars.UNIT_AGENT_ENABLED }}

jobs:
  agent-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agent-repository || github.repository }}
          ref: ${{ inputs.agent-ref || github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.agent-node-version }}"
      - shell: bash
        run: |
          set -euo pipefail
          if [ ! -f dist/cli.js ]; then
            npm ci --ignore-scripts --no-audit --no-fund >/dev/null
            npm run build:unit-agent >/dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ua-agent-dist
          path: dist
          retention-days: 1
          overwrite: true

  prepare:
    needs: agent-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      guard_skip: ${{ steps.guard.outputs.skip }}
      has_work: ${{ steps.detect.outputs.has_work }}
      has_notice: ${{ steps.notice.outputs.has_notice }}
      languages: ${{ steps.plan.outputs.languages }}
      toolchains: ${{ steps.plan.outputs.toolchains }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.agent-node-version }}"
      - name: Export UA_NODE
        shell: bash
        run: echo "UA_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ua-agent-dist
          path: ${{ runner.temp }}/unit-agent-dist
      - id: guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"${UA_NODE:-node}" --throw-deprecation "$RUNNER_TEMP/unit-agent-dist/cli.js" guard'
      - id: plan
        if: steps.guard.outcome == 'success' && steps.guard.outputs.proceed == 'true' && steps.guard.outputs.status == 'ok'
        shell: bash
        run: '"${UA_NODE:-node}" --throw-deprecation "$RUNNER_TEMP/unit-agent-dist/cli.js" plan'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.proceed == 'true' && steps.plan.outputs.status == 'ok' && steps.plan.outputs.languages != '' && steps.plan.outputs.toolchains != '' && contains(fromJSON(steps.plan.outputs.languages), 'javascript') && fromJSON(steps.plan.outputs.toolchains).node.source != 'runner-default'
        with:
          node-version: ${{ fromJSON(steps.plan.outputs.toolchains).node.version }}
          node-version-file: ${{ fromJSON(steps.plan.outputs.toolchains).node.file }}
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.proceed == 'true' && steps.plan.outputs.status == 'ok' && steps.plan.outputs.languages != '' && steps.plan.outputs.toolchains != '' && contains(fromJSON(steps.plan.outputs.languages), 'python') && fromJSON(steps.plan.outputs.toolchains).python.source != 'runner-default'
        with:
          python-version: ${{ fromJSON(steps.plan.outputs.toolchains).python.version }}
          python-version-file: ${{ fromJSON(steps.plan.outputs.toolchains).python.file }}
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.proceed == 'true' && steps.plan.outputs.status == 'ok' && steps.plan.outputs.languages != '' && steps.plan.outputs.toolchains != '' && contains(fromJSON(steps.plan.outputs.languages), 'java') && fromJSON(steps.plan.outputs.toolchains).java.source != 'runner-default'
        with:
          distribution: ${{ fromJSON(steps.plan.outputs.toolchains).java.distribution }}
          java-version: ${{ fromJSON(steps.plan.outputs.toolchains).java.version }}
          java-version-file: ${{ fromJSON(steps.plan.outputs.toolchains).java.file }}
      - id: install
        if: steps.guard.outputs.proceed == 'true' && steps.plan.outputs.status == 'ok'
        shell: bash
        run: '"${UA_NODE:-node}" --throw-deprecation "$RUNNER_TEMP/unit-agent-dist/cli.js" install'
      - id: baseline
        if: steps.guard.outputs.proceed == 'true' && steps.plan.outputs.status == 'ok' && steps.install.outputs.status == 'ok'
        shell: bash
        run: '"${UA_NODE:-node}" --throw-deprecation "$RUNNER_TEMP/unit-agent-dist/cli.js" baseline'
      - id: detect
        if: steps.guard.outputs.proceed == 'true' && steps.plan.outputs.status == 'ok' && steps.install.outputs.status == 'ok' && steps.baseline.outputs.status == 'ok'
        shell: bash
        run: '"${UA_NODE:-node}" --throw-deprecation "$RUNNER_TEMP/unit-agent-dist/cli.js" detect'
      - id: notice
        if: always() && !cancelled()
        shell: bash
        run: '"${UA_NODE:-node}" --throw-deprecation "$RUNNER_TEMP/unit-agent-dist/cli.js" notice'
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled() && steps.guard.outputs.proceed != 'false'
        with:
          name: ua-prepare
          path: .unit-agent/prepare
          retention-days: 7
          overwrite: true

  generate:
    needs: [agent-bundle, prepare]
    if: needs.prepare.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    outputs:
      status: ${{ steps.gen.outputs.status }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.agent-node-version }}"
      - uses: actions/download-artifact@v4
        with:
          name: ua-agent-dist
          path: ${{ runner.temp }}/unit-agent-dist
      - uses: actions/download-artifact@v4
        with:
          name: ua-prepare
          path: .unit-agent/prepare
      - name: Install Copilot SDK runtime
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="$RUNNER_TEMP/unit-agent-dist"
          if [ ! -f "$DIST_DIR/package.json" ]; then printf '{"private":true}\n' > "$DIST_DIR/package.json"; fi
          npm install --prefix "$DIST_DIR" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund @github/copilot-sdk@1.0.16 >/dev/null
      - id: gen
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: node --throw-deprecation "$RUNNER_TEMP/unit-agent-dist/cli.js" generate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ua-proposed
          path: .unit-agent/generate
          retention-days: 7
          overwrite: true

  validate1:
    needs: [agent-bundle, prepare, generate]
    if: needs.prepare.outputs.has_work == 'true' && needs.generate.result == 'success' && needs.generate.outputs.status == 'ok'
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      attempt: 1
      input-artifact: ua-proposed
      input-dir: generate
      input-file: generate/proposed.json
      snapshot-artifact: ua-snapshot1
      output-artifact: ua-validate1
      languages: ${{ needs.prepare.outputs.languages }}
      toolchains: ${{ needs.prepare.outputs.toolchains }}
      config-path: ${{ inputs.config-path }}
      agent-node-version: ${{ inputs.agent-node-version }}

  repair:
    needs: [agent-bundle, prepare, validate1]
    if: needs.validate1.outputs.needs_repair == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    outputs:
      status: ${{ steps.rep.outputs.status }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.agent-node-version }}"
      - uses: actions/download-artifact@v4
        with:
          name: ua-agent-dist
          path: ${{ runner.temp }}/unit-agent-dist
      - uses: actions/download-artifact@v4
        with:
          name: ua-prepare
          path: .unit-agent/prepare
      - uses: actions/download-artifact@v4
        with:
          name: ua-proposed
          path: .unit-agent/generate
      - uses: actions/download-artifact@v4
        with:
          name: ua-validate1
          path: .unit-agent/validate1
      - name: Install Copilot SDK runtime
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="$RUNNER_TEMP/unit-agent-dist"
          if [ ! -f "$DIST_DIR/package.json" ]; then printf '{"private":true}\n' > "$DIST_DIR/package.json"; fi
          npm install --prefix "$DIST_DIR" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund @github/copilot-sdk@1.0.16 >/dev/null
      - id: rep
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: node --throw-deprecation "$RUNNER_TEMP/unit-agent-dist/cli.js" repair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ua-repaired
          path: .unit-agent/repair
          retention-days: 7
          overwrite: true

  validate2:
    needs: [agent-bundle, prepare, repair]
    if: needs.repair.result == 'success' && needs.repair.outputs.status == 'ok'
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      attempt: 2
      input-artifact: ua-repaired
      input-dir: repair
      input-file: repair/proposed.repaired.json
      snapshot-artifact: ua-snapshot2
      output-artifact: ua-validate2
      languages: ${{ needs.prepare.outputs.languages }}
      toolchains: ${{ needs.prepare.outputs.toolchains }}
      config-path: ${{ inputs.config-path }}
      agent-node-version: ${{ inputs.agent-node-version }}

  publish:
    needs: [agent-bundle, prepare, generate, validate1, repair, validate2]
    if: always() && !cancelled() && needs.prepare.result != 'cancelled' && needs.prepare.outputs.guard_skip != 'true' && (needs.prepare.outputs.has_work == 'true' || needs.prepare.outputs.has_notice == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      has_tests: ${{ steps.pub.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.agent-node-version }}"
      - uses: actions/download-artifact@v4
        with:
          name: ua-agent-dist
          path: ${{ runner.temp }}/unit-agent-dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ua-prepare
          path: .unit-agent/prepare
      - uses: actions/download-artifact@v4
        if: needs.generate.result == 'success' || needs.generate.result == 'failure'
        continue-on-error: true
        with:
          name: ua-proposed
          path: .unit-agent/generate
      - uses: actions/download-artifact@v4
        if: needs.validate1.result == 'success'
        continue-on-error: true
        with:
          name: ua-snapshot1
          path: .unit-agent/snapshot1
      - uses: actions/download-artifact@v4
        if: needs.validate1.result == 'success' || needs.validate1.result == 'failure'
        continue-on-error: true
        with:
          name: ua-validate1
          path: .unit-agent/validate1
      - uses: actions/download-artifact@v4
        if: needs.repair.result == 'success' || needs.repair.result == 'failure'
        continue-on-error: true
        with:
          name: ua-repaired
          path: .unit-agent/repair
      - uses: actions/download-artifact@v4
        if: needs.validate2.result == 'success'
        continue-on-error: true
        with:
          name: ua-snapshot2
          path: .unit-agent/snapshot2
      - uses: actions/download-artifact@v4
        if: needs.validate2.result == 'success' || needs.validate2.result == 'failure'
        continue-on-error: true
        with:
          name: ua-validate2
          path: .unit-agent/validate2
      - id: pub
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UA_JOB_RESULTS: ${{ toJSON(needs) }}
          UA_APPROVAL_ENV: ${{ inputs.approval-environment }}
          UA_APPROVAL_CHECK: ${{ inputs.approval-check }}
        run: node --throw-deprecation "$RUNNER_TEMP/unit-agent-dist/cli.js" publish
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: ua-final
          path: .unit-agent/final
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

  approve-and-commit:
    needs: [agent-bundle, publish]
    if: "!cancelled() && needs.publish.result == 'success' && needs.publish.outputs.has_tests == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.approval-environment }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.agent-node-version }}"
      - uses: actions/download-artifact@v4
        with:
          name: ua-agent-dist
          path: ${{ runner.temp }}/unit-agent-dist
      - uses: actions/download-artifact@v4
        with:
          name: ua-final
          path: .unit-agent/final
      - shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UA_COMMIT_TOKEN: ${{ secrets.COMMIT_PAT || github.token }}
          UA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          UA_APPROVAL_ENV: ${{ inputs.approval-environment }}
          UA_APPROVAL_CHECK: ${{ inputs.approval-check }}
        run: node --throw-deprecation "$RUNNER_TEMP/unit-agent-dist/cli.js" commit

