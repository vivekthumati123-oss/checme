name: TaskSync-CodeConnect

on:
  workflow_dispatch:
    inputs:
      story-id:
        description: "Story: ado:123 | jira:PROJ-1 | github:#12"
        required: true
        type: string

      dry-run:
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  checks: write
  issues: write

jobs:
  tasksync:
    uses: ./.github/workflows/_agent-node-reusable.yml
    with:
      agent: tasksync
      package: "@l2/agent-tasksync"
      runtime: copilot
      dry-run: ${{ inputs.dry-run }}
      story-id: ${{ inputs.story-id }}

      output-artifact-name: implementation-plan
      output-artifact-path: handoff/implementation-plan.json

    secrets: inherit

  codeconnect:
    needs: tasksync

    uses: ./.github/workflows/_agent-node-reusable.yml
    with:
      agent: codeconnect
      package: "@l2/agent-codeconnect"
      runtime: copilot
      dry-run: ${{ inputs.dry-run }}

      input-artifact-name: implementation-plan
      input-artifact-dir: handoff

      implementation-plan-path: handoff/implementation-plan.json

      work-item-id: ${{ inputs.story-id }}

    secrets: inherit