name: unit-agent-e2e
on:
  workflow_dispatch:
    inputs:
      live-sdk:
        description: "Run evaluation harness against live Copilot SDK"
        required: false
        default: "false"

permissions: {}

jobs:
  e2e-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      UA_RUN_LIVE_EVAL: ${{ inputs.live-sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:unit-agent
      - if: inputs.live-sdk != 'true'
        run: npx vitest run test/eval
      - if: inputs.live-sdk == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: npx vitest run test/eval

