name: FinOps Report

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finops:
    uses: ./.github/workflows/_agent-python-reusable.yml
    with:
      agent: finops
      module: agents.python.finops.main
      runtime: copilot
    secrets: inherit
