version: 1
mode: report
languages:
  python:
    enabled: true
    framework: pytest
    testCommand: "pytest --cov=src --cov-report=xml:coverage.xml"
    coverageFile: coverage.xml
    coverageFormat: cobertura
    sourceGlobs:
      - "src/**/*.py"
    testPathPatterns:
      - "tests/test_{name}.py"

